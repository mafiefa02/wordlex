# Formatting and linting are file-scoped, so they run on exactly what is staged.
# The build is package-scoped, so it runs on whichever packages the outgoing
# commits touch — plus anything that depends on them.

pre-commit:
  parallel: false
  jobs:
    - name: format
      glob: "*.{js,jsx,ts,tsx,json,css}"
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true

    - name: lint
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm exec oxlint {staged_files}

pre-push:
  jobs:
    - name: build
      # turbo's default baseline is the `main` branch, which is nothing at all
      # when you are on main. Compare against the remote instead, and build
      # everything when there is no remote branch to compare against yet.
      run: |
        if git rev-parse --verify --quiet origin/main > /dev/null; then
          TURBO_SCM_BASE=origin/main pnpm exec turbo run build --affected
        else
          pnpm exec turbo run build
        fi

# Formatting and linting are file-scoped, so they run on exactly what is staged.
# The build is package-scoped, so it runs on whichever app the changes belong to.

pre-commit:
  parallel: false
  jobs:
    - name: format
      glob: "*.{js,jsx,ts,tsx,json,css}"
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true

    - name: lint
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm exec oxlint {staged_files}

pre-push:
  jobs:
    - name: build
      run: pnpm exec turbo run build --affected

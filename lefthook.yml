# Formatting and linting are file-scoped, so they run on exactly what is staged.
# The build is package-scoped, so it runs on whichever packages have changed —
# committed or not — plus anything that depends on them. The tests are not
# scoped at all: there are two suites and they take three seconds together.

pre-commit:
  parallel: false
  jobs:
    - name: format
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,css}"
      # Kept in step with ignorePatterns in .oxfmtrc.jsonc. Without this, a
      # commit of only ignored files hands oxfmt nothing and it exits 2.
      exclude:
        - "apps/play/src/routeTree.gen.ts"
        - "apps/landing/next-env.d.ts"
        - ".claude/**/*"
        - ".agents/**/*"
        - ".intent/**/*"
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true

    - name: lint
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
      exclude:
        - "apps/play/src/routeTree.gen.ts"
        - "apps/landing/next-env.d.ts"
        - ".claude/**/*"
        - ".agents/**/*"
        - ".intent/**/*"
      run: pnpm exec oxlint {staged_files}

pre-push:
  jobs:
    - name: build
      # Two things turbo will not do for us. Its default baseline is the `main`
      # branch, which is nothing at all when you are on main — so compare against
      # the remote. And root files belong to a package with no build task, so a
      # change to one of them selects nothing; build everything instead.
      run: |
        if git rev-parse --verify --quiet origin/main > /dev/null; then
          BASE=origin/main
        else
          pnpm exec turbo run build
          exit $?
        fi
        if git diff --name-only "$BASE" | grep -qE '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json|tsconfig\.base\.json)$'; then
          pnpm exec turbo run build
        else
          TURBO_SCM_BASE="$BASE" pnpm exec turbo run build --affected
        fi

    - name: test
      # Never `--affected`, and never cached: `apps/api`'s suite talks to a real
      # database and is scored against whatever `wordlex_day()` says right now,
      # so a run that passed yesterday is not evidence about today.
      # `packages/domain`'s is pure and could be cached; one rule is simpler
      # than two. It needs the `db-test` container up —
      # `docker compose up -d --wait db-test`.
      run: pnpm exec turbo run test
